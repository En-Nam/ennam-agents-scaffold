<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>showreel archetype fixture: card-carousel</title>
<style>html, body { margin: 0; background: black; height: 100%; overflow: hidden; }</style>
</head>
<body>
<!-- Test-local registry (M2 Tasks 2-5): the engine with {...ARCHETYPES, 'card-carousel'} injected, so the gated
     test does not depend on archetypes/index.mjs. Mirrors engine/core.mjs boot(): window.SHOWREEL {ready,
     renderer, renderAt, manifest, fit} + layouts {beatId: [{source, kind, px, textW}]}. ?nudge=<px> wraps draw() in a translate — the negative control that
     proves offFrame() can fail for this archetype. -->
<script type="module">
  import { createEngine } from '/engine/core.mjs';
  import { gpuRenderer } from '/engine/canvas.mjs';
  import { manifest } from '/engine/text.mjs';
  import { loadFonts } from '/engine/fonts.mjs';
  import { ARCHETYPES, TRANSITIONS } from '/archetypes/index.mjs';
  import card from '/archetypes/card-carousel.mjs';

  const q = new URLSearchParams(location.search);
  const notReady = () => { throw new Error('SHOWREEL not ready'); };
  const S = { ready: null, renderer: gpuRenderer(), renderAt: notReady, manifest, fit: notReady };
  window.SHOWREEL = S;
  S.ready = (async () => {
    const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(`${u} → HTTP ${r.status}`); return r.json(); };
    const [timeline, resolved] = await Promise.all([get('/build/timeline.json'), get('/build/resolved.json')]);
    await loadFonts('/fonts');
    // record each beat's per-card drawn px (fit() reports only the slot minimum — see deviation 1 in the test)
    const layouts = (S.layouts = {});
    let arch = { ...card, layout(rb, v, api) { const L = card.layout(rb, v, api); layouts[api.beatId] = L.cards.map((c) => ({ source: c.item.id, kind: c.kind, px: c.px, textW: c.textW })); return L; } };
    // SHOWREEL.hide = <itemId> (set by the caller, null = off): that item's text is not drawn this frame. A frame
    // rendered with and without one title gives its exact glyph mask (pixel diff) — rotated fan titles' bboxes
    // overlap their neighbours' glyphs, so a bbox alone cannot say which pixels are this title's.
    S.hide = null;
    {
      const inner = arch;
      arch = { ...inner, draw(ctx, lt, p, rb, cues) {
        if (S.hide == null) return inner.draw(ctx, lt, p, rb, cues);
        const api = { ...p.api, text: (c, item, ...rest) => (item.id === S.hide ? 0 : p.api.text(c, item, ...rest)) };
        return inner.draw(ctx, lt, { ...p, api }, rb, cues);
      } };
    }
    if (q.has('nudge')) {
      const dx = Number(q.get('nudge'));
      arch = { ...arch, draw(ctx, ...rest) { ctx.translate(dx, 0); card.draw(ctx, ...rest); } };
    }
    // ?probe: count the placeholder draws per beat into SHOWREEL.probe[beatId] = {dash, deck, title} (the caller
    // resets SHOWREEL.probe before a render). dash = a dashed stroke (row ghost slot outline); deck = a glass card body
    // with the unswung-deck fill (fan). Text-free draws the manifest cannot see (R5 review: pixels, not inference).
    // title[itemId] = the strongest normal (source-over) palette-text draw of that item this frame: its effective
    // opacity (ctx.globalAlpha × opts.alpha) — 1 = the title is drawn at full contrast, not mid-fade or dimmed.
    // ?dimfirst=<alpha>: every beat's FIRST card title drawn at that opacity — the negative control proving the hold
    // luma check sees a dimmed first card (R5 (b))
    if (q.has('dimfirst')) {
      const inner = arch, a = Number(q.get('dimfirst'));
      arch = { ...inner, draw(ctx, lt, p, rb, cues) {
        const first = rb.slots.cards.items[0].id;
        const api = { ...p.api, text: (c, item, x, y, o = {}) => p.api.text(c, item, x, y, item.id === first ? { ...o, alpha: (o.alpha ?? 1) * a } : o) };
        inner.draw(ctx, lt, { ...p, api }, rb, cues);
      } };
    }
    if (q.has('probe')) {
      const inner = arch;
      arch = { ...inner, draw(ctx, lt, p, rb, cues) {
        const rec = ((S.probe ??= {})[p.beatId] ??= { dash: 0, deck: 0, title: {} });
        const deckFill = p.api.rgba(p.api.palette.ink2, 0.5);
        let inCheck = false; // api.checkMark draws its tick on with a dash pattern — not a placeholder
        const api = {
          ...p.api,
          glass: (c, x, y, w, h, r, o) => {
            if (o && o.fill === deckFill) rec.deck++;
            // weakest glass frame (card body / tag tile / hub border alpha) this frame — R5 (b): a landed card whose
            // frame fell back to a faint border once the focus moved on read "disabled"
            const a = o && typeof o.border === 'string' ? /,\s*([\d.]+)\)$/.exec(o.border) : null;
            if (a) rec.border = Math.min(rec.border ?? 1, Number(a[1]));
            return p.api.glass(c, x, y, w, h, r, o);
          },
          checkMark: (...a) => { inCheck = true; try { return p.api.checkMark(...a); } finally { inCheck = false; } },
          text: (c, item, x, y, o = {}) => {
            if (c.globalCompositeOperation === 'source-over' && o.fill === p.api.palette.text) {
              rec.title[item.id] = Math.max(rec.title[item.id] ?? 0, c.globalAlpha * (o.alpha ?? 1));
              // the title's own shadow glow (R5 (b): a shadow halo under the bloom read as a doubled glow)
              (rec.shadow ??= {})[item.id] = Math.max(rec.shadow[item.id] ?? 0, c.shadowColor && c.shadowBlur ? c.shadowBlur : 0);
            }
            return p.api.text(c, item, x, y, o);
          },
        };
        const sld = ctx.setLineDash;
        ctx.setLineDash = function (d) { if (d.length && !inCheck) rec.dash++; return sld.call(this, d); };
        try { inner.draw(ctx, lt, { ...p, api }, rb, cues); } finally { delete ctx.setLineDash; }
      } };
    }
    const eng = createEngine({ timeline, resolved, archetypes: { ...ARCHETYPES, [card.id]: arch }, transitions: TRANSITIONS });
    S.renderAt = eng.renderAt;
    S.fit = eng.fit;
    return true;
  })();
</script>
</body>
</html>
