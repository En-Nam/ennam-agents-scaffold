<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>showreel engine - flow-graph fixture page</title>
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
  #stage { width: 100vw; height: 100vh; object-fit: contain; display: block; }
</style>
</head>
<body>
<!-- Test-local registry injection (M2 Tasks 2-5): the shipped page boots with archetypes/index.mjs only;
     flow-graph is registered there by the orchestrator after the fan-out. This page builds the SAME engine
     (createEngine + the shipped fonts) with flow-graph added, so the archetype is tested before then. -->
<script type="module">
  import { createEngine } from '/engine/core.mjs';
  import { loadFonts } from '/engine/fonts.mjs';
  import { manifest } from '/engine/text.mjs';
  import { gpuRenderer } from '/engine/canvas.mjs';
  import { ARCHETYPES, TRANSITIONS } from '/archetypes/index.mjs';
  import flowGraph from '/archetypes/flow-graph.mjs';

  const S = { ready: null, renderer: gpuRenderer(), manifest };
  window.SHOWREEL = S;
  S.ready = (async () => {
    const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(`${u} -> HTTP ${r.status}`); return r.json(); };
    const [timeline, resolved] = await Promise.all([get('/build/timeline.json'), get('/build/resolved.json')]);
    await loadFonts('/fonts');
    const eng = createEngine({ timeline, resolved, archetypes: { ...ARCHETYPES, [flowGraph.id]: flowGraph }, transitions: TRANSITIONS });
    S.renderAt = eng.renderAt;
    S.fit = eng.fit;
    return true;
  })();
</script>
</body>
</html>
